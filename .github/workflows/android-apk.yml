name: Cep Prompter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle önbelleği
        uses: gradle/actions/setup-gradle@v4
      - name: Gradle izinleri
        run: chmod +x gradlew
      - name: Debug APK oluştur
        run: ./gradlew --no-daemon clean assembleDebug
      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Cep-Prompter-beta02-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
